services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lauksatset
      POSTGRES_USER: lauksatset
      POSTGRES_PASSWORD: lauksatset
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lauksatset"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lauksatset:lauksatset@postgres:5432/lauksatset
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

